name: Canopy
options:
  bundleIdPrefix: com.canopy
packages:
  CanopyPkg:
    path: Canopy
  ScenarioKitPkg:
    path: ScenarioKit
targets:
  CanopyHostApp:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources: CanopyHostApp
    settings:
      GENERATE_INFOPLIST_FILE: YES
      INFOPLIST_KEY_UILaunchScreen_Generation: YES
      INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
      INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
    dependencies:
      - package: CanopyPkg
        product: Canopy
  CanopyUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources: Canopy/UITests
    settings:
      GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: CanopyHostApp

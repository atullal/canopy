name: Android CI
on:
  push:
    branches: [ "main", "feat/*android*" ]
  pull_request:
    branches: [ "main" ]
    paths:
      - 'apps/android/**'
      - '.github/workflows/android.yml'
      - 'scenarios/**'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - name: Enable KVM
      run: |
        echo 'KERNEL=="kvm", GROUP=="kvm", MODE=="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm
        sudo chmod a+rw /dev/kvm || true
    - uses: actions/checkout@v4
    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    - name: Grant execute permission for gradlew
      run: chmod +x apps/android/gradlew || true
        
    - name: Run Unit Tests and Lint
      run: |
        cd apps/android
        ./gradlew test lint
    - name: Run Emulator Tests
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 33
        target: google_apis
        arch: x86_64
        profile: pixel_6
        script: bash -c "cd apps/android && ./gradlew connectedAndroidTest; EXIT_CODE=\$?; mkdir -p app/build/reports/androidTests/connected/screenshots; adb pull /sdcard/Android/data/com.canopy.simulator/files/screenshots app/build/reports/androidTests/connected/ || true; exit \$EXIT_CODE"
    - name: Upload Screenshots
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: android-screenshots
        path: apps/android/app/build/reports/androidTests/connected/screenshots/
    - name: Upload ATF Output
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: android-atf-report
        path: apps/android/app/build/reports/androidTests/connected/

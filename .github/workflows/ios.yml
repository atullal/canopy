name: iOS CI

on:
  push:
    branches: [ "main", "feat/fake-friend-request-ios" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build and Test iOS
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable

    - name: Run Canopy Unit Tests
      run: |
        cd apps/ios/Canopy
        swift test

    - name: Install Xcodegen
      run: brew install xcodegen

    - name: Generate Xcode Project for UI Tests
      run: |
        cd apps/ios
        xcodegen generate

    - name: Run Canopy UI Tests and Accessibility Audit
      run: |
        cd apps/ios
        xcodebuild test \
          -project Canopy.xcodeproj \
          -scheme CanopyUITests \
          -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=latest' \
          -resultBundlePath TestResults.xcresult \
          -enableCodeCoverage YES \
          -testLanguage en \
          -testRegion US

    - name: Upload Test Results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: ios-test-results
        path: apps/ios/TestResults.xcresult
